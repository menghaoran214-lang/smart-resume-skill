<!doctype html>
<html lang="$language">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>$name — $intention</title>
<style>
:root { --accent: $accent; }
* { box-sizing: border-box; }
body { margin: 0; background: #edf0f3; color: #182b3c; font-family: Arial, "Microsoft YaHei", sans-serif; }
.tools { max-width: 210mm; margin: 18px auto; padding: 0 20px; font-size: 14px; line-height: 1.6; }
.page { width: 210mm; min-height: 297mm; margin: 20px auto; padding: 18mm; background: white; }
h1 { font-size: 25pt; margin: 0 0 12px; } h2 { font-size: 13pt; margin: 24px 0 10px; color: #244d68; }
p { font-size: 10.5pt; line-height: 1.55; margin: 8px 0; overflow-wrap: anywhere; }
.meta { color: #425b6e; } .demo { color: #9f361f; font-weight: bold; }
.section-number { display: none; }
h2 { color: var(--accent); }
.page > .meta:last-of-type { padding-bottom: 12px; border-bottom: 1.5px solid var(--accent); }
body[data-style="ats"] { color: #000; }
body[data-style="ats"] h2, body[data-style="ats"] .meta { color: #000; }
body[data-style="ats"] .page > .meta { border: 0; }
body[data-style="technical"] section { display: grid; grid-template-columns: 32mm minmax(0, 1fr); gap: 6mm; margin-top: 24px; }
body[data-style="technical"] h2 { margin: 0; border-right: 1px solid var(--accent); padding-right: 3mm; }
body[data-style="technical"] .section-body p:first-child { margin-top: 0; }
body[data-style="executive"] .page { border-top: 10mm solid var(--accent); padding-top: 8mm; }
body[data-style="editorial"] .page { padding: 20mm; }
body[data-style="editorial"] h1 { text-align: center; letter-spacing: .08em; }
body[data-style="editorial"] .page > .meta { border: 0; }
body[data-style="editorial"] h2 { border-top: 1px solid var(--accent); padding-top: 10px; }
body[data-style="creative"] .page { border-left: 6mm solid var(--accent); padding-left: 12mm; }
body[data-style="creative"] .section-number { display: inline; }
body[data-spacing="airy"] p { line-height: 1.72; }
.photo { float: right; width: 25mm; height: 32mm; object-fit: contain; margin-left: 8mm; }
footer { margin-top: 24px; font-size: 9pt; color: #617487; }
@media (max-width: 820px) { .page { width: auto; min-height: auto; margin: 12px; padding: 24px; } h1 { font-size: 23pt; } }
@media (max-width: 540px) {
body[data-style="technical"] section { display: block; }
body[data-style="technical"] h2 { border-right: 0; margin-bottom: 12px; }
body[data-style="editorial"] .page { padding: 24px; }
}
@page { size: A4; margin: 0; }
@media print { body { background: white; } .tools { display: none; } .page { margin: 0; break-after: page; } .page:last-child { break-after: auto; } }
</style>
</head>
<body data-style="$style" data-spacing="$spacing">
<div class="tools">$editing_note</div>
$pages
</body>
</html>

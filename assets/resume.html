<!doctype html>
<html lang="$language">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>$name — $intention</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #edf0f3; color: #182b3c; font-family: Arial, "Microsoft YaHei", sans-serif; }
.tools { max-width: 210mm; margin: 18px auto; padding: 0 20px; font-size: 14px; line-height: 1.6; }
.page { width: 210mm; min-height: 297mm; margin: 20px auto; padding: 18mm; background: white; }
h1 { font-size: 25pt; margin: 0 0 12px; } h2 { font-size: 13pt; margin: 24px 0 10px; color: #244d68; }
p { font-size: 10.5pt; line-height: 1.55; margin: 8px 0; overflow-wrap: anywhere; }
.meta { color: #425b6e; } .demo { color: #9f361f; font-weight: bold; }
.photo { float: right; width: 25mm; height: 32mm; object-fit: contain; margin-left: 8mm; }
footer { margin-top: 24px; font-size: 9pt; color: #617487; }
@media (max-width: 820px) { .page { width: auto; min-height: auto; margin: 12px; padding: 24px; } h1 { font-size: 23pt; } }
@page { size: A4; margin: 0; }
@media print { body { background: white; } .tools { display: none; } .page { margin: 0; break-after: page; } .page:last-child { break-after: auto; } }
</style>
</head>
<body>
<div class="tools">$editing_note</div>
$pages
</body>
</html>

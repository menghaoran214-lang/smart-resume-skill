name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r skills/smart-resume/requirements.txt
      - run: python -m pip install Pillow
      - name: Gallery and CJK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-arphic-uming
          echo "SMART_RESUME_FONT=/usr/share/fonts/truetype/arphic/uming.ttc" >> "$GITHUB_ENV"
      - name: Gallery dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --yes --no-progress
          $popplerBinary = Get-ChildItem C:\ProgramData\chocolatey\lib\poppler -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $popplerBinary) { throw "pdftoppm was not installed" }
          $popplerBinary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Skill tests
        run: python -m unittest discover -s skills/smart-resume/tests -v
      - name: README tests
        run: python -m unittest discover -s tests -v
      - name: README is up to date
        run: python scripts/render_readme.py --check
      - name: Package the skill
        run: python skills/smart-resume/scripts/package.py --out dist/smart-resume-skill-0.2.0.zip

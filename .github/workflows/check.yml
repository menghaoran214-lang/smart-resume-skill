name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r skills/smart-resume/requirements.txt
      - name: Skill tests
        run: python -m unittest discover -s skills/smart-resume/tests -v
      - name: README tests
        run: python -m unittest discover -s tests -v
      - name: README is up to date
        run: python scripts/render_readme.py --check
      - name: Package the skill
        run: python skills/smart-resume/scripts/package.py --out dist/smart-resume-skill-0.1.0.zip

name: Refresh README
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install Pillow
      - name: Regenerate README
        run: python scripts/make_banner.py
      - name: Regenerate README
        run: python scripts/render_readme.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md README.en.md assets/banner.zh-CN.png assets/banner.zh-TW.png assets/banner.en.png
          git diff --staged --quiet || (git commit -m "chore: refresh README [skip ci]" && git push)
